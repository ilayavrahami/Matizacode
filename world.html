<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מציה — עולם</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="neon-bg" id="world-wrap">
    <div class="float-symbols" id="float-symbols"></div>

    <div class="topbar">
      <a href="dashboard.html" class="logout-link">→ מפת העולמות</a>
      <span class="coin-pill" id="coin-pill">🪙 0</span>
    </div>

    <div class="arcade-header">
      <span class="arcade-title" id="world-title-top">...</span>
    </div>

    <div class="island-nav-row">
      <a class="island-arrow" id="arrow-prev">▶</a>
      <div id="island-stage-container" style="flex:1;">טוען אי... ⏳</div>
      <a class="island-arrow" id="arrow-next">◀</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/time-limits.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/shop-data.js"></script>
  <script src="js/worlds-data.js"></script>
  <script src="js/world.js"></script>
</body>
</html>
