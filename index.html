<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מציה — כניסה</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <img src="assets/maccia-mascot.svg" class="mascot" alt="מציה">
      <h1 class="display">מציה</h1>
      <p style="color:var(--text-dim); margin-top:-6px;">היייי! בואו נתחיל ליצור משחקים 🎮</p>

      <form id="login-form">
        <input class="field" type="text" id="username" placeholder="שם משתמש" autocomplete="username" required>
        <input class="field" type="password" id="password" placeholder="סיסמה" autocomplete="current-password" required>
        <div class="error-msg" id="error-msg"></div>
        <button type="submit" class="btn btn-block" style="margin-top:16px;">כניסה 🚀</button>
      </form>

      <p style="margin-top:22px; font-size:.85rem; color:var(--text-dim);">
        אין לך משתמש? תבקשו מההורים שיפנו אלינו 😊
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
